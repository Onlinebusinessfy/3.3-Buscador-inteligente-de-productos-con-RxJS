<section class="search-section">

  <div class="section-heading">
    <div>
      <h2>Catálogo de productos</h2>
      <p>Busca y administra los productos de tu inventario.</p>
    </div>
  </div>

  <div class="filters-container">

    <div class="search-box">
      <span class="search-icon">⌕</span>

      <input
        type="text"
        [formControl]="busqueda"
        placeholder="Buscar producto por nombre..."
      >
    </div>

    <div class="filter-group">

      <label for="categoria">Categoría</label>

      <select
        id="categoria"
        (change)="cambiarCategoria($any($event.target).value)"
      >
        <option value="Todas">Todas las categorías</option>
        <option value="Tecnología">Tecnología</option>
        <option value="Ropa">Ropa</option>
        <option value="Hogar">Hogar</option>
        <option value="Deportes">Deportes</option>
      </select>

    </div>

    <div class="filter-group">

      <label for="orden">Ordenar por precio</label>

      <select
        id="orden"
        (change)="cambiarOrden($any($event.target).value)"
      >
        <option value="ninguno">Sin ordenar</option>
        <option value="menor">Menor a mayor</option>
        <option value="mayor">Mayor a menor</option>
      </select>

    </div>

  </div>

</section>
